name: science-video-workbench

services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE must be set}:${APP_VERSION:?APP_VERSION must be set}
    platform: linux/amd64
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      TRUST_PROXY: ${TRUST_PROXY:-1}
      FFMPEG_PATH: /usr/bin/ffmpeg
      LAN_ACCESS_TOKEN: ${LAN_ACCESS_TOKEN:?LAN_ACCESS_TOKEN must be set}
      MAX_CONCURRENT_RENDERS: ${MAX_CONCURRENT_RENDERS:-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      VIDEO_PROVIDER_URL: ${VIDEO_PROVIDER_URL:-}
      VIDEO_PROVIDER_API_KEY: ${VIDEO_PROVIDER_API_KEY:-}
      ARK_API_KEY: ${ARK_API_KEY:-}
      ARK_VIDEO_MODEL: ${ARK_VIDEO_MODEL:-doubao-seedance-2-0-mini-260615}
      ARK_TEXT_MODEL: ${ARK_TEXT_MODEL:-doubao-seed-2-1-pro-260628}
      ARK_MAX_GENERATED_SHOTS: ${ARK_MAX_GENERATED_SHOTS:-3}
      MATERIAL_PUBLIC_BASE_URL: ${MATERIAL_PUBLIC_BASE_URL:-}
      OUTPUT_PUBLIC_BASE_URL: ${OUTPUT_PUBLIC_BASE_URL:-}
      PERSONAL_API_ALLOWED_HOSTS: ${PERSONAL_API_ALLOWED_HOSTS:-}
    volumes:
      - type: bind
        source: ${DATA_DIR:?DATA_DIR must be set}
        target: /app/data
    expose:
      - "8787"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=2g
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8787/api/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - backend

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      app:
        condition: service_healthy
    environment:
      LAN_HOST: ${LAN_HOST:?LAN_HOST must be set}
    ports:
      - "${LAN_BIND_ADDRESS:?LAN_BIND_ADDRESS must be set}:${HTTP_PORT:-80}:80"
      - "${LAN_BIND_ADDRESS:?LAN_BIND_ADDRESS must be set}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
