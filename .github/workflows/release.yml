name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate tag and package version
        id: version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v${package_version}" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v${package_version}." >&2
            exit 1
          fi
          echo "value=${package_version}" >> "$GITHUB_OUTPUT"

      - name: Verify source
        run: npm run verify

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish server image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/cjllz/science-video-workbench:${{ steps.version.outputs.value }}
            ghcr.io/cjllz/science-video-workbench:latest

      - name: Build release bundle
        run: npm run release:package

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Science Video Workbench $GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md \
            .artifacts/releases/science-video-workbench-${GITHUB_REF_NAME}-online-linux-amd64.tar.gz \
            .artifacts/releases/science-video-workbench-${GITHUB_REF_NAME}-online-linux-amd64.tar.gz.sha256 \
            .artifacts/releases/SHA256SUMS
